services:

  flask:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: pdfbot

    restart: unless-stopped

    env_file:
      - .env

    expose:
      - "5000"

    volumes:
      - ./Outputs:/app/Outputs
      - ./logs:/app/logs

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    networks:
      - pdfbot-network

  nginx:
    image: nginx:1.28-alpine

    container_name: pdfbot-nginx

    restart: unless-stopped

    depends_on:
      flask:
        condition: service_healthy

    ports:
      - "80:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    networks:
      - pdfbot-network

networks:
  pdfbot-network:
    driver: bridge